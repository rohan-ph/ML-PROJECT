# =============================================================================
# SNN Violence Detection — Central Configuration
# =============================================================================
# All hyperparameters in one file. Override via CLI args in train.py / eval scripts.

# ---- Data Pipeline ----
data:
  # RWF-2000 dataset settings
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  streams_dir: "data/streams"

  # Kaggle dataset slugs
  rwf2000_slug: "vulamnguyen/rwf2000"
  hockey_slug: "yassershrief/hockey-fight-vidoes"
  rlvs_slug: "mohamedmustafa/real-life-violence-situations-dataset"

  # Preprocessing
  source_fps: 30            # RWF-2000 native fps
  target_fps: 16            # Subsample to this fps
  resolution: 112           # Resize frames to 112x112
  input_encoding: "frame_diff"  # "frame_diff" or "rgb"

  # Training windows
  clip_length: 32           # Number of timesteps per training window (T)
  val_split_from_train: 0.1 # Hold out 10% of train for validation

  # Augmentation
  augmentation:
    horizontal_flip: true
    random_crop_scale: [0.85, 1.0]
    brightness_jitter: 0.2
    contrast_jitter: 0.2

  # Synthetic stream generation
  streams:
    num_streams: 20
    min_duration_minutes: 5
    max_duration_minutes: 30
    violence_ratio: 0.05     # Violence makes up <5% of stream
    min_gap_seconds: 30      # Minimum gap between incidents
    merge_threshold_seconds: 10  # Merge incidents closer than this

# ---- SNN Model ----
model:
  snn:
    channels: [32, 64, 128, 256]
    tau_conv: 2.0            # LIF time constant for conv layers
    tau_readout: 4.0         # LIF time constant for readout neuron
    v_threshold: 1.0
    v_reset: 0.0             # Hard reset (set to null for soft reset)
    surrogate: "atan"        # Surrogate gradient function
    surrogate_alpha: 2.0
    detach_reset: true       # Detach gradient through reset
    num_classes: 2

  # Baseline model settings
  baselines:
    mobilenet_pretrained: true
    gru_hidden_size: 256
    gru_num_layers: 1
    dropout: 0.3

# ---- Incident Neuron (Core Novelty) ----
incident:
  beta: 0.9                 # Leak factor for membrane integrator
  th_on: 0.6                # Upper threshold (IDLE → ACTIVE)
  th_off: 0.3               # Lower threshold (ACTIVE → IDLE)
  min_on_frames: 8          # Min consecutive frames above th_on to trigger
  min_off_frames: 16        # Min consecutive frames below th_off to end
  evidence_mode: "softmax"  # "softmax" (membrane potential) or "spike_rate"
  evidence_window: 8        # Sliding window for spike rate evidence

  # Grid search ranges for tuning
  tune:
    beta_range: [0.8, 0.85, 0.9, 0.95]
    th_on_range: [0.5, 0.55, 0.6, 0.65, 0.7]
    th_off_range: [0.2, 0.25, 0.3, 0.35, 0.4]
    min_on_range: [4, 8, 12, 16]
    min_off_range: [8, 16, 24, 32]

# ---- Clip Assembler ----
assembler:
  pre_event_seconds: 10     # Seconds of footage before incident onset
  post_event_seconds: 10    # Seconds of footage after incident offset
  output_format: "mp4"      # Output video format
  codec: "mp4v"             # OpenCV VideoWriter codec
  include_hash: true        # SHA-256 hash in metadata JSON
  merge_close_incidents: true  # Merge incidents within post_event window

# ---- Training ----
training:
  epochs: 100
  batch_size: 16
  num_workers: 4
  pin_memory: true

  optimizer:
    type: "adamw"
    lr: 1.0e-3
    weight_decay: 1.0e-4
    betas: [0.9, 0.999]

  scheduler:
    type: "cosine"
    T_max: 100               # Same as epochs
    eta_min: 1.0e-6

  # Early stopping
  early_stopping:
    patience: 15
    min_delta: 0.001
    monitor: "val_loss"

  # Checkpointing
  checkpoint:
    save_every_epoch: true
    save_best_only: false    # Also save every-epoch for resume
    checkpoint_dir: "results/checkpoints"

  # Multi-seed
  seeds: [42, 123, 456, 789, 1024]

  # Logging
  log_dir: "results/logs"
  log_firing_rates: true     # Log per-layer firing rates for SNN

# ---- Energy Estimation ----
energy:
  # 45nm CMOS standard values (Horowitz, ISSCC 2014)
  E_MAC: 4.6e-12            # Joules (32-bit multiply-accumulate)
  E_AC: 0.9e-12             # Joules (32-bit accumulate/addition only)
  technology_node: "45nm"

# ---- Evaluation ----
evaluation:
  results_dir: "results"
  significance_level: 0.05   # For McNemar's test
  boundary_metrics:
    tiou_thresholds: [0.3, 0.5, 0.7]
    completeness_target: 0.95  # 95% coverage target

# ---- Paths ----
paths:
  project_root: "."
  data_root: "data"
  results_root: "results"
  checkpoint_dir: "results/checkpoints"
  log_dir: "results/logs"
  clips_dir: "results/clips"
